name: contribution-snake-preview
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: snake-preview
  cancel-in-progress: true
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3; verified upstream 2026-10-27
        with:
          github_user_name: darcykun
          outputs: |
            dist/snake.svg?color_snake=%232879B8&color_dots=%23ebedf0,%2389CFF0,%235CAADB,%232879B8,%2316476A
            dist/snake-dark.svg?palette=github-dark&color_snake=%2389CFF0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: actual-contribution-snake
          path: dist/*.svg

<svg xmlns="http://www.w3.org/2000/svg" width="640" height="36" viewBox="0 0 640 36" role="img" aria-labelledby="title"><title id="title">Small tools. Clear boundaries. Useful agents.</title><style>@media(prefers-reduced-motion:reduce){.reveal{animation:none!important;clip-path:none!important}.cursor{display:none}}.reveal{animation:typing 7s steps(43,end) infinite;clip-path:inset(0 0 0 0)}@keyframes typing{0%{clip-path:inset(0 100% 0 0)}55%,100%{clip-path:inset(0 0 0 0)}}</style><rect width="640" height="36" rx="6" fill="#0B1522"/><text class="reveal" x="12" y="24" font-family="monospace" font-size="17" fill="#89CFF0">Small tools. Clear boundaries. Useful agents.</text></svg>